<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Indústrias Wayne - Acesso Interno</title>
    <link rel="stylesheet" href="func.css">
    <script src="func.js"defer></script>
</head>
<body>

    <main id="area-funcionario">
        <div class="painel-funcionario">
            <header class="painel-cabecalho">
                <h2 class="titulo-empresa">WAYNE ENTERPRISES</h2>
                    <img src="./image/crie_uma_logo_para_minha_fabrica_o_nome_da_fabrica_sera__WAYNE_INDUSTRIES_GOSTARIA_DE_UMA_LOGO_EXPRECIVA_E_IMPONENTE__1_-removebg-preview.png" alt="">
            </header>
            
            <div class="painel-corpo">
                <button class="btn-sair"><i class="fi fi-rr-leave"></i>Sair</button>
                <div class="perfil">
                    
                    <div class="identificacao">
                        <h1 class="nome-funcionario"></h1>
                        <p class="cargo-funcionario"></p>
                    </div>
                </div>

                <div class="detalhes-acesso">
                    <h3>Nível de Acesso ao Sistema</h3>
                    <p class="nivel-acesso">
                        <span class="luz-status"></span> Funcionário Autorizado
                    </p>
                </div>

                <div class="status-operacional">
                    <h3>Status Operacional</h3>
                    <div class="status-grid">
                        <div class="status-item">
                            <span>Equipamentos</span>
                            <strong class="status-ok">OK</strong>
                        </div>
                        <div class="status-item">
                            <span>Comunicação</span>
                            <strong class="status-ok">ONLINE</strong>
                        </div>
                        <div class="status-item">
                            <span>Veículos</span>
                            <strong class="status-ok">DISPONÍVEL</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
