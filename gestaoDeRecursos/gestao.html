<!DOCTYPE html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css"
    />
    <link rel="stylesheet" href="gestao.css" />
    <script src="gestao.js" defer></script>
    <title>Gestão de Recursos</title>
  </head>
  <body>
    <header>
      <h1><i class="fi fi-rr-chart-histogram"></i>Gestão de Recursos</h1>
      <div class="adm">
        <p id="cargo"></p>
        <button class="btn-sair"><i class="fi fi-rr-leave"></i>Sair</button>
      </div>
    </header>

    <section class="container escolhas">
      <div class="escolha">
        <a href="#" class="item ativo" data-tipo="Todos"
          ><i class="fi fi-sr-apps"></i>Todos</a
        >
        <a href="#" class="item" data-tipo="Equipamento"
          ><i class="fi fi-bs-tools"></i>Equipamentos</a
        >
        <a href="#" class="item" data-tipo="Veículo"
          ><i class="fi fi-bs-car"></i>Veículos</a
        >
        <a href="#" class="item" data-tipo="Dispositivo"
          ><i class="fi fi-bs-shield-check"></i>Dispositivo de Segurança</a
        >
      </div>
    </section>
    
    <section class="container adicionar">
      <div class="container-formulario-recurso">
        <h2>Adicionar/Editar Recurso</h2>
        <form id="formulario-recurso">
          <input type="hidden" id="recurso-id" />
          <input
            type="text"
            id="recurso-nome"
            placeholder="Nome do Equipamento"
            required
          />
          <select id="recurso-tipo" required>
            <option value="" disabled selected>Selecione o Tipo</option>
            <option value="Veículo">Veículo</option>
            <option value="Equipamento">Equipamento</option>
            <option value="Dispositivo">Dispositivo de Segurança</option>
          </select>
          <button type="submit">Salvar Recurso</button>
        </form>
        <p id="total-recursos"></p>
      </div>
    </section>

    <section class="container tabela">
      <div class="tabela">
        <table id="tabela-recursos">
          <thead>
            <tr>
              <th>Nome</th>
              <th>Tipo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
    
  </body>
</html>
