<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-bold-straight/css/uicons-bold-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/3.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css"

    />
    <link rel="stylesheet" href="painel.css">
    <script src="painel.js" defer></script>
    <title>Dashbord Wayne Industries</title>
</head>
<body>
    <main>

        <section id="container">
            <div class="superior">
                <div class="logo-desc">
                    
                <img src="./image/crie_uma_logo_para_minha_fabrica_o_nome_da_fabrica_sera__WAYNE_INDUSTRIES_GOSTARIA_DE_UMA_LOGO_EXPRECIVA_E_IMPONENTE__1_-removebg-preview.png" alt="logo" style="width: 100px;">
                <h1>Wayne Industries</h1>
                <h3>Painel Gerente</h3>
            </div>
            <div>

                <p id="gerente"></p>
            </div>

                    <div class="hora-data"></div>
                    <button class="btn-sair-painel"><i class="fi fi-rr-leave"></i>sair</button>
            </div>
        </section>
        <section>

            <aside class="menu">
                <ul>
                    <li><a href="#" class="item-menu ativo" id="dashboard"><i class="fi fi-rr-chart-histogram"></i>Dashboard</a></li>
                    <li><a href="#" class="item-menu" id="seguranca"><i class="fi fi-rr-lock"></i>Segurança</a></li>
                    <li><a href="#" class="item-menu" id="recursos"><i class="fi fi-rr-bulb"></i>recursos</a></li>
                    <li><a href="#" class="item-menu" id="atividades"><i class="fi fi-rr-list-check"></i>Atividades</a></li>
                </ul>
            </aside>
                <section class="telas">

                    <article class="principal-tela">
                        <div class="tela1 card-painel">
                            <h3 >Status de Segurança</h3>
                            <h1 class="verde">SEGURANÇA</h1>
                            <div class="seguranca">
                                <div class="verde">

                                    <i class="fi fi-rr-shield-check"></i>
                                </div>
                            </div>
                            <progress value="95" max="100"></progress>
                            <h3>95% dos Sistemas Protegidos</h3>
                        </div>

                        <div class="tela2 card-painel">
                            <h3>Consumo de Energia</h3>
                            <h1 class="azul">2.4 KW</h1>
                            <div class="seguranca ">
                                <i class="fi fi-rr-bolt"></i>
                            </div>
                            <progress value="78" max="100"></progress>
                            <h3>78% da Capacidade Total</h3>
                        </div>

                        <div class="tela3 card-painel">
                            <h3>Funcionarios Ativos</h3>
                            <h1 class="amarelo">1.354</h1>
                            <div class="seguranca ">
                                <i class="fi fi-rr-users-alt"></i>
                            </div>
                            <h3>+ 20 desde ontem</h3>
                        </div>

                        <div class="tela4 card-painel">
                            <h3>Alerta Ativos</h3>
                            <h1 class="vermelho">4</h1>
                            <div class="seguranca ">
                                <i class="fi fi-rr-sensor-alert"></i>
                            </div>
                            <h3>3 críticos , 1 moderado</h3>
                        </div>
                    </article>

                   
                </section>
            </main>
    </body>
</html>
